<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery List</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',-apple-system,sans-serif; background:#faf8f5; color:#3d3529; min-height:100vh; }
    .banner { height:80px; background:linear-gradient(135deg,#e8ddd3,#d4c5b5 30%,#c9b99a 60%,#bfae8e); position:relative; }
    .banner::after { content:''; position:absolute; bottom:0; left:0; right:0; height:30px; background:linear-gradient(to top,#faf8f5,transparent); }
    .container { max-width:720px; margin:-10px auto 0; padding:0 1.75rem 3rem; position:relative; }
    h1 {
      font-family:'Playfair Display',serif; font-size:2rem; font-weight:600; color:#2c2418;
      margin-bottom:0.2rem;
    }
    h1 .sub {
      display:block; font-family:'Inter',sans-serif; font-size:0.85rem; font-weight:400;
      color:#9c8b76; margin-top:0.2rem;
    }
    .nav-strip { display:flex; gap:0.5rem; margin:1rem 0 1.25rem; flex-wrap:wrap; }
    .nav-strip a {
      font-size:0.78rem; color:#9c8b76; text-decoration:none;
      border:1px solid #ebe5dc; padding:0.35rem 0.9rem; border-radius:20px; background:#fff;
    }
    .nav-strip a.back { background:#2c2418; color:#fff; border-color:#2c2418; }

    .card {
      background:#fff; border:1px solid #ebe5dc; border-radius:10px;
      padding:1.25rem 1.4rem; margin-bottom:1rem;
    }
    .card-header {
      display:flex; align-items:center; justify-content:space-between;
      gap:0.5rem; flex-wrap:wrap; margin-bottom:0.6rem;
    }
    .card-title {
      font-family:'Playfair Display',serif; font-size:1.15rem; font-weight:600; color:#2c2418;
    }
    .actions { display:flex; gap:0.3rem; }
    .icon-btn {
      font-size:0.7rem; padding:0.3rem 0.7rem;
      border-radius:14px; border:1px solid #ebe5dc; background:#fff;
      color:#6b5d4d; cursor:pointer; font-family:inherit;
      transition:border-color 0.15s, background 0.15s;
    }
    .icon-btn:hover { border-color:#c9b99a; background:#faf5ec; }
    .icon-btn.primary {
      background:#4a8c6f; color:#fff; border-color:#4a8c6f;
    }
    .icon-btn.primary:hover { background:#3d7a5f; border-color:#3d7a5f; }

    .add-row { display:flex; gap:0.4rem; margin-bottom:0.8rem; }
    .add-input {
      flex:1; border:1px solid #ebe5dc; border-radius:6px;
      padding:0.45rem 0.6rem; font-size:0.85rem; font-family:inherit;
      color:#3d3529; outline:none;
    }
    .add-input:focus { border-color:#c9b99a; }
    .add-btn {
      padding:0.45rem 0.85rem; border-radius:6px; border:1px solid #d4c5b5;
      background:#f5f0e8; font-size:0.78rem; color:#6b5d4d; cursor:pointer;
      font-family:inherit;
    }
    .add-btn:hover { background:#ebe5dc; }

    .grocery-item {
      display:flex; align-items:center; gap:0.5rem;
      padding:0.4rem 0; font-size:0.92rem; border-bottom:1px solid #f9f7f4;
    }
    .grocery-item:last-child { border-bottom:none; }
    .grocery-cb {
      width:18px; height:18px; border:1.5px solid #c9b99a;
      border-radius:4px; cursor:pointer; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:#fff; font-size:0.7rem; color:transparent;
    }
    .grocery-cb.checked { background:#c9b99a; color:#fff; border-color:#c9b99a; }
    .grocery-text {
      flex:1; cursor:text;
      padding:0.15rem 0.35rem; margin:-0.15rem -0.35rem;
      border-radius:4px; outline:none;
    }
    .grocery-text:focus { background:#faf5ec; }
    .grocery-text.done { text-decoration:line-through; color:#c9bfb0; }
    .grocery-del {
      font-size:0.85rem; color:#d4c5b5; cursor:pointer;
      padding:0.1rem 0.3rem;
    }
    .grocery-del:hover { color:#c2553a; }

    .aisle-header {
      font-size:0.7rem; font-weight:600;
      color:#9c8b76; text-transform:uppercase; letter-spacing:1.2px;
      padding:0.7rem 0 0.3rem; margin-top:0.5rem;
      border-bottom:1px solid #ebe5dc;
    }
    .aisle-header:first-child { margin-top:0; padding-top:0.1rem; }

    .empty-state {
      text-align:center; color:#b8a48e; font-style:italic;
      padding:1.5rem 0; font-size:0.9rem;
    }

    @media print {
      body { background:#fff; }
      body > *:not(.print-host) { display:none !important; }
      .print-host { display:block !important; padding:0.5in; }
      .print-host * { visibility:visible; }
      .print-host h1 {
        font-family:'Playfair Display',Georgia,serif;
        font-size:1.8rem; margin:0 0 1rem 0; color:#2c2418;
      }
      .print-host h2 {
        font-family:'Playfair Display',Georgia,serif;
        font-size:1.1rem; margin:1rem 0 0.3rem 0; color:#555;
        text-transform:uppercase; letter-spacing:1.5px;
        border-bottom:1px solid #ccc; padding-bottom:0.2rem;
      }
      .print-host .print-meta { font-size:0.85rem; color:#555; margin-bottom:1rem; }
      .print-host ul { list-style:none; padding:0; margin:0; }
      .print-host li {
        padding:0.3rem 0; border-bottom:1px solid #e5e0d7;
        font-size:0.95rem; display:flex; align-items:center; gap:0.5rem;
      }
      .print-host li::before {
        content:''; display:inline-block;
        width:14px; height:14px;
        border:1px solid #888; border-radius:2px;
        flex-shrink:0;
      }
      .print-host li.done { color:#999; text-decoration:line-through; }
      .print-host li.done::before { background:#999; }
    }
  </style>
</head>
<body>
  <div class="banner"></div>
  <div class="container">
    <h1>
      Grocery List
      <span class="sub" id="list-count"></span>
    </h1>

    <div class="nav-strip">
      <a class="back" href="index.html">← Dashboard</a>
      <a href="meals.html">Meal Planner</a>
      <a href="recipes.html">Recipes</a>
      <a href="health.html">Health</a>
      <a href="weekend-plan.html">Weekend Plan</a>
      <a href="travel.html">Travel</a>
      <a href="wardrobe.html">Wardrobe</a>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Your list</div>
        <div class="actions">
          <button class="icon-btn" id="btn-copy" onclick="copyGroceryList()" title="Copy as text">📋 Copy</button>
          <button class="icon-btn" onclick="printGroceryList()" title="Print">🖨️ Print</button>
          <button class="icon-btn primary" onclick="generateGroceries()" title="Pull ingredients from this week's planned meals">+ From Meals</button>
        </div>
      </div>

      <div class="add-row">
        <input class="add-input" id="grocery-input" placeholder="Add item…" />
        <button class="add-btn" onclick="addGroceryItem()">Add</button>
      </div>

      <div id="grocery-list"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:"AIzaSyCedyhhnkomtrW3ynwAkzSbtrePMTyZPmQ",
      authDomain:"morning-dashboard-4c62b.firebaseapp.com",
      databaseURL:"https://morning-dashboard-4c62b-default-rtdb.firebaseio.com",
      projectId:"morning-dashboard-4c62b",
      storageBucket:"morning-dashboard-4c62b.firebasestorage.app",
      messagingSenderId:"289564921391",
      appId:"1:289564921391:web:4ed9e388d5f63218f780da"
    });
    const db = firebase.database();

    let groceries = [];
    let mealPlan = {};
    let recipes = {};

    // Aisle classifier — mirrors the version that used to live on meals.html
    const AISLE_RULES = [
      ['Pantry', ['coconut milk','almond milk','oat milk','soy milk','cashew milk','rice milk','condensed milk','evaporated milk',
        'curry powder','curry paste','curry leaves','curry sauce','curry',
        'spice','seasoning','rub','garam masala','five-spice','allspice',
        'pistachio','walnut','pecan','cashew','almond','peanut','hazelnut','macadamia','brazil nut','pine nut']],
      ['Bakery', ['bread','baguette','bagel','roll','bun','tortilla','naan','pita','croissant','focaccia','sourdough','pita bread','english muffin']],
      ['Produce', [
        'apple','banana','orange','lemon','lime','grape','berry','berries','strawberr','blueberr','raspberr','blackberr','mango','peach','pear','pineapple','melon','watermelon','avocado','plum','cherry','kiwi','fig',
        'lettuce','spinach','kale','arugula','romaine','cabbage','broccoli','cauliflower','asparagus','zucchini','squash','pumpkin','cucumber','celery','carrot','radish','beet','sweet potato','potato','onion','shallot','scallion','spring onion','green onion','leek','garlic','ginger','chili','chile','pepper','jalapen','tomato','mushroom','corn','peas','green bean','snap pea','okra','eggplant','fennel','parsnip','turnip','sprout','endive','watercress','collard','chard',
        'basil','parsley','cilantro','coriander','mint','rosemary','thyme','sage','dill','tarragon','chive','herb'
      ]],
      ['Meat & Seafood', [
        'chicken','beef','pork','sausage','bacon','turkey','duck','lamb','veal','steak','ground beef','mince','meatball','ribs','prosciutto','salami','pepperoni','ham','fish','salmon','tuna','cod','shrimp','prawn','crab','lobster','scallop','mussel','clam','oyster','sardine','anchovy','tilapia','halibut','trout'
      ]],
      ['Dairy & Eggs', [
        'milk','cream','half-and-half','butter','margarine','cheese','cheddar','mozzarella','parmesan','feta','brie','goat cheese','cottage cheese','ricotta','yogurt','yoghurt','greek yogurt','sour cream','egg','eggs','tofu','tempeh'
      ]],
      ['Frozen', ['frozen','ice cream','ice-cream','popsicle','sorbet','gelato','frozen pizza','frozen vegetable']],
      ['Pantry-2', [
        'flour','sugar','salt','pepper','oil','olive oil','vegetable oil','canola','sesame oil','vinegar','soy sauce','tamari','fish sauce','oyster sauce','sriracha','hot sauce','ketchup','mustard','mayo','mayonnaise','salsa','pasta sauce','marinara','tomato sauce','broth','stock','bouillon','tomato paste','peanut butter','almond butter','jam','jelly','honey','maple syrup','baking powder','baking soda','yeast','vanilla',
        'pasta','spaghetti','noodle','penne','linguine','rice','quinoa','couscous','barley','farro','oat','cereal','granola',
        'bean','lentil','chickpea','tin','can','canned','tinned',
        'seed','sesame','sunflower','pumpkin seed','flax',
        'chocolate','cocoa','chia'
      ]],
      ['Snacks', ['chip','cracker','cookie','pretzel','popcorn','candy','bar','protein bar','granola bar']],
      ['Beverages', ['water','sparkling','seltzer','juice','soda','coke','pepsi','sprite','coffee','espresso','tea','wine','beer','cocktail','tequila','vodka','gin','rum','whiskey','bourbon','kombucha','lemonade','smoothie']],
      ['Household', ['paper towel','tissue','toilet paper','napkin','foil','plastic wrap','zip','soap','detergent','dish soap','dishwasher','laundry','sponge','cleaner','trash bag','garbage bag','battery','light bulb']],
    ];
    // Unmatched → Pantry (no separate "Other")
    const AISLE_ORDER = ['Produce','Bakery','Meat & Seafood','Dairy & Eggs','Frozen','Pantry','Snacks','Beverages','Household'];

    function classifyGroceryItem(text) {
      const t = String(text || '').toLowerCase();
      for (const [aisle, keywords] of AISLE_RULES) {
        for (const k of keywords) {
          const re = new RegExp('(^|[^a-z])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(s|es)?($|[^a-z])');
          if (re.test(t)) return aisle === 'Pantry-2' ? 'Pantry' : aisle;
        }
      }
      return 'Pantry';
    }

    function groupGroceriesByAisle(items) {
      const buckets = {};
      items.forEach((item, originalIdx) => {
        const aisle = classifyGroceryItem(item.text);
        if (!buckets[aisle]) buckets[aisle] = [];
        buckets[aisle].push({ item, originalIdx });
      });
      return AISLE_ORDER
        .filter(a => buckets[a] && buckets[a].length)
        .map(a => ({ aisle: a, entries: buckets[a] }));
    }

    function escapeGroceryHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderGroceries() {
      const target = document.getElementById('grocery-list');
      const countEl = document.getElementById('list-count');
      if (!groceries.length) {
        target.innerHTML = '<div class="empty-state">Your grocery list is empty. Add items above, or pull from your meal plan.</div>';
        countEl.textContent = '';
        return;
      }
      const open = groceries.filter(g => !g.done).length;
      const total = groceries.length;
      countEl.textContent = `${open} open · ${total - open} done · ${total} total`;
      const groups = groupGroceriesByAisle(groceries);
      let html = '';
      groups.forEach(g => {
        html += `<div class="aisle-header">${g.aisle}</div>`;
        g.entries.forEach(({ item, originalIdx: i }) => {
          html += `<div class="grocery-item">
            <div class="grocery-cb ${item.done ? 'checked' : ''}" onclick="toggleGrocery(${i})">${item.done ? '✓' : ''}</div>
            <span class="grocery-text ${item.done ? 'done' : ''}"
              contenteditable="true" spellcheck="false"
              data-original="${escapeGroceryHtml(item.text)}"
              onblur="saveGroceryEdit(${i}, this)"
              onkeydown="onGroceryKeydown(event, ${i}, this)">${escapeGroceryHtml(item.text)}</span>
            <span class="grocery-del" onclick="deleteGrocery(${i})">✕</span>
          </div>`;
        });
      });
      target.innerHTML = html;
    }

    function saveGroceryEdit(i, el) {
      const newText = el.textContent.trim();
      const orig = el.dataset.original || '';
      if (!newText) {
        groceries.splice(i, 1);
        db.ref('mealGroceries').set(groceries);
        renderGroceries();
        return;
      }
      if (newText === orig) return;
      groceries[i].text = newText;
      db.ref('mealGroceries').set(groceries);
    }

    function onGroceryKeydown(e, i, el) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      else if (e.key === 'Escape') { el.textContent = el.dataset.original || ''; el.blur(); }
    }

    function addGroceryItem() {
      const input = document.getElementById('grocery-input');
      const text = input.value.trim();
      if (!text) return;
      groceries.push({ text, done: false });
      db.ref('mealGroceries').set(groceries);
      input.value = '';
      input.focus();
      renderGroceries();
    }

    function toggleGrocery(i) {
      groceries[i].done = !groceries[i].done;
      db.ref('mealGroceries').set(groceries);
      renderGroceries();
    }

    function deleteGrocery(i) {
      groceries.splice(i, 1);
      db.ref('mealGroceries').set(groceries);
      renderGroceries();
    }

    function copyGroceryList() {
      if (!groceries.length) { alert('Grocery list is empty.'); return; }
      const groups = groupGroceriesByAisle(groceries);
      const text = groups.map(g => {
        const lines = g.entries.map(({ item }) => (item.done ? '[x] ' : '[ ] ') + item.text);
        return `## ${g.aisle}\n${lines.join('\n')}`;
      }).join('\n\n');
      const finish = () => {
        const btn = document.getElementById('btn-copy');
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = '✓ Copied';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(finish).catch(() => fallback());
      } else {
        fallback();
      }
      function fallback() {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); finish(); }
        catch { prompt('Copy the list:', text); }
        finally { document.body.removeChild(ta); }
      }
    }

    function printGroceryList() {
      if (!groceries.length) { alert('Grocery list is empty.'); return; }
      let host = document.getElementById('print-host');
      if (!host) {
        host = document.createElement('div');
        host.id = 'print-host';
        host.className = 'print-host';
        document.body.appendChild(host);
      }
      const today = new Date().toLocaleDateString('en-US', {
        weekday:'long', month:'long', day:'numeric', year:'numeric'
      });
      const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const groups = groupGroceriesByAisle(groceries);
      const groupHtml = groups.map(g => `
        <h2>${esc(g.aisle)}</h2>
        <ul>${g.entries.map(({ item }) => `<li class="${item.done ? 'done' : ''}">${esc(item.text)}</li>`).join('')}</ul>
      `).join('');
      host.innerHTML = `
        <h1>Grocery List</h1>
        <div class="print-meta">${today} · ${groceries.length} item${groceries.length === 1 ? '' : 's'}</div>
        ${groupHtml}
      `;
      window.print();
    }

    // Auto-generate from this week's meal plan
    function getWeekStart(offset) {
      const now = new Date(); const day = now.getDay();
      const start = new Date(now);
      start.setDate(now.getDate() - day + 1 + offset * 7); // Monday start
      start.setHours(0,0,0,0);
      return start;
    }
    function dateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function generateGroceries() {
      const start = getWeekStart(0);
      const newItems = [];
      const seen = new Set(groceries.map(g => g.text.toLowerCase()));

      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const dk = dateKey(d);
        const dayMeals = mealPlan[dk] || {};
        Object.values(dayMeals).forEach(recipeId => {
          const recipe = recipes[recipeId];
          if (recipe && recipe.ingredients) {
            const ingredients = recipe.ingredients.split('\n').map(l => l.trim()).filter(Boolean);
            ingredients.forEach(ing => {
              if (!seen.has(ing.toLowerCase())) {
                seen.add(ing.toLowerCase());
                newItems.push({ text: ing, done: false });
              }
            });
          }
        });
      }

      if (newItems.length === 0) {
        alert('No new ingredients found in this week’s meal plan. Add recipes to days in Meal Planner first.');
        return;
      }
      groceries = groceries.concat(newItems);
      db.ref('mealGroceries').set(groceries);
      renderGroceries();
    }

    // Enter in the input adds the item
    document.getElementById('grocery-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addGroceryItem();
    });

    // Live listeners
    db.ref('mealGroceries').on('value', snap => {
      const v = snap.val();
      groceries = Array.isArray(v) ? v : (v ? Object.values(v) : []);
      renderGroceries();
    });
    db.ref('mealPlan').on('value', snap => { mealPlan = snap.val() || {}; });
    db.ref('recipes').on('value', snap => { recipes = snap.val() || {}; });
  </script>
</body>
</html>
