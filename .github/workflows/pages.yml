name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages artifacts hard-cap at 1 GB. Keep only what the phone PWA needs.
      # outfit-images is local editor only. Full wardrobe catalogue still deploys
      # (thumbs + wardrobe-images) for zoom; fail early if we approach the cap.
      - name: Trim deploy tree under 1 GB
        run: |
          set -euo pipefail
          rm -rf outfit-images backups old-versions .git .DS_Store
          rm -f friend-snapshot.json
          find . -name '.DS_Store' -delete 2>/dev/null || true
          echo "Deploy tree sizes:"
          du -sh . wardrobe-images wardrobe-thumbs 2>/dev/null || true
          BYTES=$(du -sb . | awk '{print $1}')
          MB=$((BYTES / 1024 / 1024))
          echo "Total deploy tree: ${MB} MB"
          # Soft gate at ~850 MB uncompressed so zip stays under 1 GB
          if [ "$BYTES" -gt $((850 * 1024 * 1024)) ]; then
            echo "::error::Deploy tree is ${MB} MB — GitHub Pages max is 1 GB. Remove large folders before publishing (outfit-images is already excluded). Wardrobe full images may need compression."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
